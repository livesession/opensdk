[package]
name = "opensdk_ruby"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "ruby SDK emitter — OpenSDK IR -> generated ruby SDK code (Rust port of @xyd-js/opensdk-ruby; generated-code emitter, vendored runtime + tests deferred)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
opensdk_cli_common = { path = "../opensdk_cli_common" }
opensdk_core = { path = "../opensdk_core" }

[dev-dependencies]
# DEV-ONLY: spawns language toolchains; must never become a real dependency
# (these crates link into the @xyd-js/native cdylib).
opensdk_e2e = { path = "../opensdk_e2e" }
