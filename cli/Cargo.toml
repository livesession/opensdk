[package]
name = "opensdk"
edition.workspace = true
# NOT `version.workspace = true`. The libraries all sit at the workspace's 0.0.0
# because nothing versions them independently — but this crate is the released
# artifact, and `release.yml` refuses to publish a tag that disagrees with this
# number. Inheriting 0.0.0 would make that gate compare every tag against a
# constant, which is the same as not having it.
version = "0.2.0"
license.workspace = true
publish = false
description = "The `opensdk` binary: parse | generate | diff | publish | run | init | xsdk, plus the emitter registry"

# THE EMITTER REGISTRY LIVES HERE, not in opensdk_core. A `static EMITTERS`
# in core would make core depend on the 7 emitter crates, which all depend on
# core — a cycle. This crate is the one place where "every emitter" is in scope,
# exactly like the TS `registerBuiltinEmitters()` lives in the CLI package.
[[bin]]
name = "opensdk"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
# MANDATORY `workspace = true`: `preserve_order` is load-bearing. sdk.json
# language-section order decides the multi-target generate order, and
# `grouping.mountRules` is scanned longest-prefix-first with a strict `>` so a
# re-sort silently changes which rule applies. Every golden in __fixtures__ was
# captured from JS object key order.
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
# `xsdk --output x.yaml` serialises the enriched spec (js-yaml `dump` analog).
serde_yaml = "0.9"

# ── already ported; depended on, never re-implemented ────────────────────────
opensdk_core = { path = "../crates/opensdk_core" }
opensdk_config = { path = "../crates/opensdk_config" }
opensdk_chain = { path = "../crates/opensdk_chain" }
opensdk_diff = { path = "../crates/opensdk_diff" }
opensdk_framework = { path = "../crates/opensdk_framework" }
oas_doc = { path = "../crates/oas_doc" }
openapi2opensdk = { path = "../crates/openapi2opensdk" }
openapi2opencli = { path = "../crates/openapi2opencli" }
opencli2go = { path = "../crates/opencli2go" }
opencli2rust = { path = "../crates/opencli2rust" }

# ── the 7 emitters (the registry table) ──────────────────────────────────────
opensdk_go = { path = "../crates/opensdk_go" }
opensdk_python = { path = "../crates/opensdk_python" }
opensdk_node = { path = "../crates/opensdk_node" }
opensdk_ruby = { path = "../crates/opensdk_ruby" }
opensdk_java = { path = "../crates/opensdk_java" }
opensdk_dotnet = { path = "../crates/opensdk_dotnet" }
opensdk_rust = { path = "../crates/opensdk_rust" }
